{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}
{% block page_title %}Error{% endblock %}

{% block content %}
<div class="container-fluid px-4">
  <div class="empty-state py-5 mt-5">
    <i class="bi bi-exclamation-triangle-fill fs-1 text-warning"></i>
    <h3 class="mt-3">Page Not Found</h3>
    <p class="text-muted">The page you're looking for doesn't exist or an error occurred.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary mt-2">
      <i class="bi bi-house-fill me-1"></i>Go to Dashboard
    </a>
  </div>
</div>
{% endblock %}
